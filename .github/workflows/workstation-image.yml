name: workstation-image

# Publishes the workstation image (images/workstation/Dockerfile) for
# linux/amd64 and linux/arm64:
#
#   ghcr.io/<owner>/sandbox-workstation:<tag>   on a version tag, and :latest
#   ghcr.io/<owner>/sandbox-workstation:edge    on every push to main, and weekly
#
# It is built on the desktop image that sandbox-cli publishes: :edge builds on
# sandbox-desktop:edge, a version tag on sandbox-desktop:latest. That image
# changes in another repository, so :edge is rebuilt weekly to pick it up, and
# by hand (workflow_dispatch) when it cannot wait.
#
# Every run builds for amd64 first and runs tests/smoke.sh on it; nothing is
# pushed unless that passes. Pull requests stop there.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      base:
        description: "the desktop image to build on (default: by ref, as above)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The runner's disk is small for an image this size.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: base
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          # ghcr.io names are lowercase.
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          tag=edge
          if [ "$REF_TYPE" = tag ]; then tag=latest; fi
          echo "image=${INPUT_BASE:-ghcr.io/$owner/sandbox-desktop:$tag}" >> "$GITHUB_OUTPUT"

      - name: Build (amd64, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: images/workstation
          file: images/workstation/Dockerfile
          platforms: linux/amd64
          load: true
          tags: sandbox-workstation:smoke
          build-args: BASE=${{ steps.base.outputs.image }}
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Smoke test
        run: ENGINE=docker sh tests/smoke.sh sandbox-workstation:smoke

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandbox-workstation
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Publish (amd64 and arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/workstation
          file: images/workstation/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BASE=${{ steps.base.outputs.image }}
          cache-from: type=gha
